# Single-package repo. `packages` is required — without it pnpm 10 (the deploy
# box) fails every command with "packages field missing or empty".
packages:
  - .

# pnpm 11 gates dependency build scripts. Astro needs both: esbuild installs its
# platform binary, sharp its libvips bindings.
allowBuilds:
  esbuild: true
  sharp: true
